<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urenregistratie - Delivery Express Amsterdam</title>
    <!-- Supabase inladen -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        
        /* Container voor het formulier */
        .container { max-width: 500px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; text-align: center; }
        label { font-weight: bold; margin-top: 15px; display: block; color: #333; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        
        /* Knoppen */
        .btn-blauw { width: 100%; padding: 15px; background-color: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-blauw:hover { background-color: #004494; }
        
        /* Inlogscherm styling */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f4f9; }
        .login-box { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 100%; }
        
        /* Verberg de app totdat er is ingelogd */
        #appScherm { display: none; }
    </style>
</head>
<body>

    <!-- CHAUFFEUR INLOG SCHERM -->
    <div id="chauffeurLoginScherm" class="login-container">
        <div class="login-box">
            <h2 style="margin-top: 0;">DEA Chauffeurs</h2>
            <p>Voer de toegangscode in om uren te registreren.</p>
            <!-- Invoerveld wachtwoord -->
            <input type="password" id="toegangscode" placeholder="Toegangscode" style="text-align: center; font-size: 18px;">
            <button onclick="checkChauffeurCode()" class="btn-blauw">Inloggen</button>
            <p id="foutmeldingCode" style="color: red; display: none; margin-top: 15px; font-weight: bold;">Onjuiste code, probeer het opnieuw.</p>
        </div>
    </div>

    <!-- DE REST VAN DE APP (Wordt pas getoond na inloggen) -->
    <div id="appScherm">
        <div class="container">
            <h2>Urenregistratie</h2>
            <form id="urenForm">
                <label>Datum</label>
                <input type="date" id="datum" required>
                
                <label>Ritnummer / Omschrijving</label>
                <input type="text" id="rit_omschrijving" placeholder="Bijv: Rit 1 naar Utrecht of klantnaam" required>

                <label>Chauffeur</label>
                <select id="chauffeur_id" required>
                    <option value="">Laden...</option>
                </select>

                <label>Vrachtwagen</label>
                <select id="vrachtwagen_id" required>
                    <option value="">Laden...</option>
                </select>

                <label>Starttijd</label>
                <input type="time" id="starttijd" required>

                <label>Eindtijd</label>
                <input type="time" id="eindtijd" required>

                <label>Pauze (in minuten)</label>
                <input type="number" id="pauze_minuten" value="0" min="0" required placeholder="Aantal minuten">

                <button type="submit" class="btn-blauw">Versturen</button>
            </form>
            <p id="succesMelding" style="color: green; text-align: center; display: none; font-weight: bold; margin-top: 15px;">Uren succesvol opgeslagen!</p>
        </div>
    </div>

    <script>
        // Database connectie
        const SUPABASE_URL = 'https://lmclewyqceztcsvqkoaf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gv68Kwlf5w0P8bry7hMBaw_SrE_sAjS';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let chauffeursData = [];

        // --- INLOG LOGICA ---
        function checkChauffeurCode() {
            const ingevoerdeCode = document.getElementById('toegangscode').value;
            const juisteCode = "DEA2026"; // <-- HIER KUN JE DE TOEGANGSCODE VERANDEREN ALS JE WILT

            if (ingevoerdeCode === juisteCode) {
                // Code klopt! Verberg inlog, toon app en haal de chauffeurs op.
                document.getElementById('chauffeurLoginScherm').style.display = 'none';
                document.getElementById('appScherm').style.display = 'block';
                laadStamgegevens();
            } else {
                document.getElementById('foutmeldingCode').style.display = 'block';
            }
        }

        // Zorg dat 'Enter' ook werkt bij inloggen
        document.getElementById('toegangscode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkChauffeurCode();
            }
        });


        // --- APP LOGICA ---
        
        // Simpele, feilloze datum-instelling van vandaag
        document.getElementById('datum').value = new Date().toISOString().split('T')[0];

        // Haal chauffeurs en vrachtwagens uit database voor in het keuzemenu
        async function laadStamgegevens() {
            // Chauffeurs laden
            const { data: chauffeurs } = await db.from('chauffeurs').select('*').order('naam');
            const chSelect = document.getElementById('chauffeur_id');
            chSelect.innerHTML = '<option value="">Kies je naam...</option>';
            if(chauffeurs) {
                chauffeursData = chauffeurs; // We bewaren dit om later uurloon op te zoeken
                chauffeurs.forEach(c => {
                    chSelect.innerHTML += `<option value="${c.id}">${c.naam}</option>`;
                });
            }

            // Vrachtwagens laden
            const { data: vrachtwagens } = await db.from('vrachtwagens').select('*').order('kenteken');
            const vrSelect = document.getElementById('vrachtwagen_id');
            vrSelect.innerHTML = '<option value="">Kies vrachtwagen...</option>';
            if(vrachtwagens) {
                vrachtwagens.forEach(v => {
                    vrSelect.innerHTML += `<option value="${v.id}">${v.kenteken}</option>`;
                });
            }
        }

        // Als de chauffeur op "Versturen" klikt
        document.getElementById('urenForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Voorkom dat pagina herlaadt
            
            // Gegevens uit formulier halen
            const datum = document.getElementById('datum').value;
            const rit_omschrijving = document.getElementById('rit_omschrijving').value;
            const chauffeur_id = document.getElementById('chauffeur_id').value;
            const vrachtwagen_id = document.getElementById('vrachtwagen_id').value;
            const starttijd = document.getElementById('starttijd').value;
            const eindtijd = document.getElementById('eindtijd').value;
            const pauze_minuten = parseInt(document.getElementById('pauze_minuten').value) || 0;

            // Bereken uren
            const start = new Date(`1970-01-01T${starttijd}:00`);
            let eind = new Date(`1970-01-01T${eindtijd}:00`);
            if (eind < start) eind.setDate(eind.getDate() + 1); // Als de rit na middernacht eindigt
            
            const brutoUren = (eind - start) / (1000 * 60 * 60);
            let nettoUren = brutoUren - (pauze_minuten / 60);
            if(nettoUren < 0) nettoUren = 0; // Voorkom negatieve uren

            // Zoek uurloon op voor interne loonkosten in admin paneel
            const chauffeur = chauffeursData.find(c => c.id == chauffeur_id);
            const uurloon = chauffeur && chauffeur.uurloon ? parseFloat(chauffeur.uurloon) : 0;
            const totaal_loon_bedrag = nettoUren * uurloon;

            // Database data klaarmaken (zonder weeknummer, want de database doet dit zelf)
            const opslagData = {
                datum: datum,
                rit_omschrijving: rit_omschrijving,
                chauffeur_id: chauffeur_id,
                vrachtwagen_id: vrachtwagen_id,
                starttijd: starttijd,
                eindtijd: eindtijd,
                pauze_minuten: pauze_minuten,
                netto_gewerkte_uren: nettoUren.toFixed(2),
                totaal_loon_bedrag: totaal_loon_bedrag.toFixed(2),
                status: 'Te controleren'
            };

            // Opslaan in Supabase
            const { error } = await db.from('urenregistratie').insert(opslagData);

            if (error) {
                alert("Er ging iets mis met opslaan: " + error.message);
            } else {
                // Formulier leegmaken en succes tonen
                document.getElementById('urenForm').reset();
                document.getElementById('datum').value = new Date().toISOString().split('T')[0]; // Datum weer terugzetten
                
                document.getElementById('succesMelding').style.display = 'block';
                setTimeout(() => document.getElementById('succesMelding').style.display = 'none', 4000); // Melding verdwijnt na 4s
            }
        });
    </script>
</body>
</html>
