<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urenregistratie - Delivery Express Amsterdam</title>
    <!-- Supabase inladen -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        
        /* Taalwisselaar styling */
        .language-selector { position: absolute; top: 15px; right: 15px; }
        .language-selector select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; background-color: white; cursor: pointer; width: auto; margin: 0; }

        /* Container voor het formulier */
        .container { max-width: 500px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); position: relative; }
        h2 { color: #0056b3; text-align: center; }
        label { font-weight: bold; margin-top: 15px; display: block; color: #333; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        
        /* Knoppen */
        .btn-blauw { width: 100%; padding: 15px; background-color: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-blauw:hover { background-color: #004494; }
        
        /* Inlogscherm styling */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f4f9; position: relative; }
        .login-box { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 100%; position: relative;}
        
        /* Verberg de app totdat er is ingelogd */
        #appScherm { display: none; }
    </style>
</head>
<body>

    <!-- TAAL KEUZE MENU -->
    <div class="language-selector">
        <select id="langSelect" onchange="veranderTaal(this.value)">
            <option value="nl">🇳🇱 Nederlands</option>
            <option value="en">🇬🇧 English</option>
            <option value="es">🇪🇸 Español</option>
        </select>
    </div>

    <!-- CHAUFFEUR INLOG SCHERM -->
    <div id="chauffeurLoginScherm" class="login-container">
        <div class="login-box">
            <h2 style="margin-top: 0;" data-i18n="login_title">DEA Chauffeurs</h2>
            <p data-i18n="login_desc">Voer je persoonlijke code in om uren te registreren.</p>
            <input type="password" id="toegangscode" placeholder="Toegangscode" data-i18n-placeholder="login_placeholder" style="text-align: center; font-size: 18px;">
            <button onclick="checkChauffeurCode()" class="btn-blauw" data-i18n="login_btn">Inloggen</button>
            <p id="foutmeldingCode" style="color: red; display: none; margin-top: 15px; font-weight: bold;" data-i18n="login_error">Onjuiste code, probeer het opnieuw.</p>
        </div>
    </div>

    <!-- DE REST VAN DE APP -->
    <div id="appScherm">
        <div class="container">
            <h2 data-i18n="app_title">Urenregistratie</h2>
            <form id="urenForm">
                <label data-i18n="lbl_date">Datum</label>
                <input type="date" id="datum" required>
                
                <label data-i18n="lbl_desc">Ritnummer / Omschrijving</label>
                <input type="text" id="rit_omschrijving" placeholder="Bijv: Rit 1 naar Utrecht of klantnaam" data-i18n-placeholder="ph_desc" required>

                <label data-i18n="lbl_driver">Chauffeur</label>
                <select id="chauffeur_id" required>
                    <option value="" data-i18n="opt_loading">Laden...</option>
                </select>

                <label data-i18n="lbl_truck">Vrachtwagen</label>
                <select id="vrachtwagen_id" required>
                    <option value="" data-i18n="opt_loading">Laden...</option>
                </select>

                <label data-i18n="lbl_start">Starttijd</label>
                <input type="time" id="starttijd" required>

                <label data-i18n="lbl_end">Eindtijd</label>
                <input type="time" id="eindtijd" required>

                <label data-i18n="lbl_pause">Pauze (in minuten)</label>
                <input type="number" id="pauze_minuten" value="0" min="0" required placeholder="Aantal minuten" data-i18n-placeholder="ph_pause">

                <button type="submit" class="btn-blauw" data-i18n="btn_submit">Versturen</button>
            </form>
            <p id="succesMelding" style="color: green; text-align: center; display: none; font-weight: bold; margin-top: 15px;" data-i18n="msg_success">Uren succesvol opgeslagen!</p>
        </div>
    </div>

    <script>
        // Database connectie
        const SUPABASE_URL = 'https://lmclewyqceztcsvqkoaf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gv68Kwlf5w0P8bry7hMBaw_SrE_sAjS';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let chauffeursData = [];

        // --- VERTALINGEN ---
        const vertalingen = {
            nl: {
                login_title: "DEA Chauffeurs",
                login_desc: "Voer je persoonlijke code in om uren te registreren.",
                login_placeholder: "Persoonlijke code",
                login_btn: "Inloggen",
                login_error: "Onjuiste code, probeer het opnieuw.",
                app_title: "Urenregistratie",
                lbl_date: "Datum",
                lbl_desc: "Ritnummer / Omschrijving",
                ph_desc: "Bijv: Rit 1 naar Utrecht of klantnaam",
                lbl_driver: "Chauffeur",
                opt_loading: "Laden...",
                opt_driver_kies: "Kies je naam...",
                lbl_truck: "Vrachtwagen",
                opt_truck_kies: "Kies vrachtwagen...",
                lbl_start: "Starttijd",
                lbl_end: "Eindtijd",
                lbl_pause: "Pauze (in minuten)",
                ph_pause: "Aantal minuten",
                btn_submit: "Versturen",
                msg_success: "Uren succesvol opgeslagen!"
            },
            en: {
                login_title: "DEA Drivers",
                login_desc: "Enter your personal access code to register hours.",
                login_placeholder: "Personal code",
                login_btn: "Login",
                login_error: "Incorrect code, please try again.",
                app_title: "Hours Registration",
                lbl_date: "Date",
                lbl_desc: "Route number / Description",
                ph_desc: "E.g.: Route 1 to Utrecht or client name",
                lbl_driver: "Driver",
                opt_loading: "Loading...",
                opt_driver_kies: "Choose your name...",
                lbl_truck: "Truck",
                opt_truck_kies: "Choose truck...",
                lbl_start: "Start time",
                lbl_end: "End time",
                lbl_pause: "Break (in minutes)",
                ph_pause: "Number of minutes",
                btn_submit: "Submit",
                msg_success: "Hours successfully saved!"
            },
            es: {
                login_title: "Conductores DEA",
                login_desc: "Introduce tu código personal para registrar tus horas.",
                login_placeholder: "Código personal",
                login_btn: "Iniciar sesión",
                login_error: "Código incorrecto, inténtalo de nuevo.",
                app_title: "Registro de Horas",
                lbl_date: "Fecha",
                lbl_desc: "Número de ruta / Descripción",
                ph_desc: "Ej.: Ruta 1 a Utrecht o nombre del cliente",
                lbl_driver: "Conductor",
                opt_loading: "Cargando...",
                opt_driver_kies: "Elige tu nombre...",
                lbl_truck: "Camión",
                opt_truck_kies: "Elige camión...",
                lbl_start: "Hora de inicio",
                lbl_end: "Hora de finalización",
                lbl_pause: "Pausa (en minutos)",
                ph_pause: "Número de minutos",
                btn_submit: "Enviar",
                msg_success: "¡Horas guardadas con éxito!"
            }
        };

        function veranderTaal(taal) {
            localStorage.setItem('voorkeursTaal', taal);
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const sleutel = element.getAttribute('data-i18n');
                element.innerText = vertalingen[taal][sleutel];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const sleutel = element.getAttribute('data-i18n-placeholder');
                element.placeholder = vertalingen[taal][sleutel];
            });
            if (document.getElementById('chauffeur_id').options.length > 0 && !document.getElementById('chauffeur_id').disabled) {
                document.getElementById('chauffeur_id').options[0].text = vertalingen[taal]['opt_driver_kies'];
            }
            if (document.getElementById('vrachtwagen_id').options.length > 0) {
                document.getElementById('vrachtwagen_id').options[0].text = vertalingen[taal]['opt_truck_kies'];
            }
        }

        window.onload = function() {
            let opgeslagenTaal = localStorage.getItem('voorkeursTaal') || 'nl';
            document.getElementById('langSelect').value = opgeslagenTaal;
            veranderTaal(opgeslagenTaal);
        };

        // --- NIEUWE INLOG LOGICA MET DATABASE CHECK ---
        async function checkChauffeurCode() {
            const ingevoerdeCode = document.getElementById('toegangscode').value;
            if (!ingevoerdeCode) return;

            document.getElementById('foutmeldingCode').style.display = 'none';

            // Haal de chauffeurslijst op uit de database
            const { data: chauffeurs, error } = await db.from('chauffeurs').select('*');

            if (chauffeurs) {
                // Zoek of de ingevoerde pincode overeenkomt met een chauffeur
                const ingelogdeChauffeur = chauffeurs.find(c => c.pincode == ingevoerdeCode);

                if (ingelogdeChauffeur) {
                    // Code klopt! Verberg inlog en toon formulier
                    document.getElementById('chauffeurLoginScherm').style.display = 'none';
                    document.getElementById('appScherm').style.display = 'block';
                    
                    // Laad de data in de velden
                    await laadStamgegevens();

                    // Selecteer de ingelogde chauffeur automatisch
                    const chSelect = document.getElementById('chauffeur_id');
                    chSelect.value = ingelogdeChauffeur.id;
                    
                    // Blokkeer het veld zodat de chauffeur geen andere naam kan kiezen
                    chSelect.disabled = true;
                    chSelect.style.backgroundColor = "#e9ecef"; // Maak het visueel grijs/geblokkeerd

                } else {
                    // Verkeerde code
                    document.getElementById('foutmeldingCode').style.display = 'block';
                }
            }
        }

        document.getElementById('toegangscode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkChauffeurCode();
        });


        // --- APP LOGICA ---
        document.getElementById('datum').value = new Date().toISOString().split('T')[0];

        async function laadStamgegevens() {
            const huidigeTaal = document.getElementById('langSelect').value;

            // Chauffeurs laden
            const { data: chauffeurs } = await db.from('chauffeurs').select('*').order('naam');
            const chSelect = document.getElementById('chauffeur_id');
            chSelect.innerHTML = `<option value="">${vertalingen[huidigeTaal]['opt_driver_kies']}</option>`;
            if(chauffeurs) {
                chauffeursData = chauffeurs; 
                chauffeurs.forEach(c => {
                    chSelect.innerHTML += `<option value="${c.id}">${c.naam}</option>`;
                });
            }

            // Vrachtwagens laden
            const { data: vrachtwagens } = await db.from('vrachtwagens').select('*').order('kenteken');
            const vrSelect = document.getElementById('vrachtwagen_id');
            vrSelect.innerHTML = `<option value="">${vertalingen[huidigeTaal]['opt_truck_kies']}</option>`;
            if(vrachtwagens) {
                vrachtwagens.forEach(v => {
                    vrSelect.innerHTML += `<option value="${v.id}">${v.kenteken}</option>`;
                });
            }
        }

        document.getElementById('urenForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const datum = document.getElementById('datum').value;
            const rit_omschrijving = document.getElementById('rit_omschrijving').value;
            const chauffeur_id = document.getElementById('chauffeur_id').value;
            const vrachtwagen_id = document.getElementById('vrachtwagen_id').value;
            const starttijd = document.getElementById('starttijd').value;
            const eindtijd = document.getElementById('eindtijd').value;
            const pauze_minuten = parseInt(document.getElementById('pauze_minuten').value) || 0;

            const start = new Date(`1970-01-01T${starttijd}:00`);
            let eind = new Date(`1970-01-01T${eindtijd}:00`);
            if (eind < start) eind.setDate(eind.getDate() + 1); 
            
            const brutoUren = (eind - start) / (1000 * 60 * 60);
            let nettoUren = brutoUren - (pauze_minuten / 60);
            if(nettoUren < 0) nettoUren = 0; 

            const chauffeur = chauffeursData.find(c => c.id == chauffeur_id);
            const uurloon = chauffeur && chauffeur.uurloon ? parseFloat(chauffeur.uurloon) : 0;
            const totaal_loon_bedrag = nettoUren * uurloon;

            const opslagData = {
                datum: datum,
                rit_omschrijving: rit_omschrijving,
                chauffeur_id: chauffeur_id,
                vrachtwagen_id: vrachtwagen_id,
                starttijd: starttijd,
                eindtijd: eindtijd,
                pauze_minuten: pauze_minuten,
                netto_gewerkte_uren: nettoUren.toFixed(2),
                totaal_loon_bedrag: totaal_loon_bedrag.toFixed(2),
                status: 'Te controleren'
            };

            const { error } = await db.from('urenregistratie').insert(opslagData);

            if (error) {
                alert("Fout bij opslaan: " + error.message);
            } else {
                document.getElementById('urenForm').reset();
                
                // Zorg dat de naam behouden blijft na het wissen van het formulier
                document.getElementById('chauffeur_id').value = chauffeur_id; 
                document.getElementById('datum').value = new Date().toISOString().split('T')[0];
                
                document.getElementById('succesMelding').style.display = 'block';
                setTimeout(() => document.getElementById('succesMelding').style.display = 'none', 4000); 
            }
        });
    </script>
</body>
</html>
